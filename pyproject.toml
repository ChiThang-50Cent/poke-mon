[project]
name = "pokeai"
version = "0.1.0"
description = "Gen9 OU Singles decision model for Pokémon Showdown (local practice bot / research benchmark)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "metamon",
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
metamon = { path = "third_party/metamon", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokeai"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "server: requires the local Showdown server on localhost:8000",
]
