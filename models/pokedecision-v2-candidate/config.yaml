verbatim_contract: "## Advantages (computed once, BEFORE any actor update; `reports/w5_3_advantage_stats.json`)\n\
  - Formula: `A_t = Y_battle(POV) \u2212 V\u0302_C(s_t)`, with V\u0302 computed on\
  \ C's frozen h_t.\n  - For the W5.2 V and for the probe.\n  - Stored per C decision,\
  \ keyed by (battle, POV, decision index).\n  - Never feed actor-updated hidden states\
  \ into a critic.\n- Report mean/std/quantiles of A per critic, by opponent type\
  \ and phase.\n- Report weight stats and effective sample size `ESS = (\u03A3w)\xB2\
  /(n\xB7\u03A3w\xB2)` per \u03B2.\n- Caveat to state: W5.2 V was fit on the same\
  \ train decisions (a linear 385-param head, so overfit is minimal but nonzero);\
  \ the probe was fit on human data.\n\n## Weights and loss\n- `w_t = min(5, exp(A_t/\u03B2\
  ))` with \u03B2 \u2208 {0.5, 1.0, 2.0}.\n- Self-normalise per batch over eligible\
  \ steps: `w\u0303 = w / mean(w)`. This keeps the loss scale equal to E1.\n- Loss:\
  \ `L = mean_t[ w\u0303_t \xB7 (\u2212log \u03C0_\u03B8(a_t|s_t)) ] + 0.1 \xB7 mean_t[\
  \ KL(\u03C0_C(\xB7|s_t) \u2016 \u03C0_\u03B8(\xB7|s_t)) ]`.\n  - KL is over the\
  \ legal mask.\n  - \u03C0_C is the logged behavior probs.\n  - The mean runs over\
  \ eligible C decisions.\n- Non-C and non-model steps stay in the sequence (so the\
  \ GRU sees them) but get no loss.\n- Train on full C-POV trajectories with one uninterrupted\
  \ hidden state, as in W3/W4.\n\n## Actor settings\n- Init from C (a trainable copy).\n\
  - Drop the value head in candidates (`value_head: false`). The probe would be stale\
  \ on a changed trunk.\n- AdamW lr 1e-4, wd 1e-4, grad_clip 1.0, batch 16 trajectories.\n\
  - Exactly 5 epochs, no early stopping, keep the final weights.\n- Training seeds:\
  \ 1, 2, 3 (data order + any randomness). Deterministic CUDA. Train on cuda, sequentially,\
  \ one background job.\n- Checkpoints go in gitignored `checkpoints/w5_3/<exp>-<beta>-s<seed>/`.\n\
  \n## Experiments\n|Exp|Weight|Configs|\n|---|---|---|\n|E0|C untouched|1|\n|E1|w=1\
  \ (BC on self-play + same KL)|3 seeds|\n|E2|AWBC, W5.2 V|\u03B2\xD73, 3 seeds =\
  \ 9|\n|E3|AWBC, probe|\u03B2\xD73, 3 seeds = 9|\n\n## Offline drift (`reports/w5_3_policy_drift.json`,\
  \ on the 20% val C decisions)\n- KL(\u03C0_C\u2016\u03C0_\u03B8) mean and p95.\n\
  - Entropy vs C.\n- Greedy action-type frequency (move / switch / tera-move), and\
  \ greedy action agreement with C.\n- Plus the val weighted and unweighted NLL.\n\
  - Flag as abnormal any of: mean KL > 0.5 nats, entropy change > 30%, or a move/switch/tera\
  \ frequency shift > 10 pp.\n\n## Dev benchmark (`data/teams_w5/dev` only; `reports/w5_3_dev_ablation.json`)\n\
  Use the existing paired design: team pairs played both directions, alternating challenger,\
  \ clustered bootstrap with 5,000 resamples.\n\nOpponents:\n- Grunt, GymLeader, EmeraldKaizo;\n\
  - neural `models/pokedecision-v1` greedy;\n- RandomBaseline (regression check).\n\
  \nPreview is the same for all arms.\n\n**Stage 1 \u2014 screen \u03B2 (greedy, seed\
  \ 1 only, 200 battles per opponent):**\n- Arms: C, E1-s1, E2\xD7{3 \u03B2}, E3\xD7\
  {3 \u03B2}.\n- Pick \u03B2 per critic by the highest pooled dev delta vs C.\n\n\
  **Stage 2 \u2014 confirm, with a NEW schedule seed:**\n- Greedy, 400 battles per\
  \ opponent. Arms: C, E1 \xD7 3 seeds, E2(\u03B2*) \xD7 3 seeds, E3(\u03B2*) \xD7\
  \ 3 seeds.\n- Shuffled-advantage negative control, run only if E2(\u03B2*) or E3(\u03B2\
  *) has a seed-mean pooled delta > 0 in stage 2 greedy:\n  - Permute A within (opponent\
  \ type \xD7 phase bucket) groups.\n  - Use the better critic at its \u03B2*, 3 seeds,\
  \ added to the same stage-2 schedule.\n  - Plan for it up front. If it's triggered,\
  \ run it as an addendum on the same schedule seed.\n- Sampling mode (T=1.0), 200\
  \ per opponent. Arms: C, plus the same E1/E2/E3 \u03B2* seeds.\n\n**Report:**\n\
  - Per-arm Wilson CIs, and per-candidate paired delta vs C per opponent and pooled.\n\
  - Seed-mean deltas and how many of 3 seeds are positive.\n- Errors / illegal actions\
  \ / retries.\n- Stage-2 results are dev-selection evidence, not unbiased final estimates.\
  \ Say so.\n\n## Verdicts (pre-registered)\n- **Validity:** 0 model-illegal actions\
  \ and 0 runtime errors. Otherwise do one root-cause fix, one rerun, and keep `_run1`.\n\
  - **\"AWBC positive signal\":** for E2 or E3 at \u03B2*, all three of:\n  - seed-mean\
  \ pooled greedy delta vs C > 0;\n  - \u2265 2 of 3 seeds positive;\n  - no drift\
  \ flag.\n- **\"Weighting matters\":** the AWBC config beats E1 (seed-mean, paired)\
  \ and, if the control was run, beats the shuffled control.\n- **Severe single-opponent\
  \ regression:** a seed-mean delta < \u22125 pp with CI upper bound < 0.\n- **Gate\
  \ outcome**, from the user plan \xA73:\n  - clearly negative \u2192 don't collect\
  \ 5k; check weighting, normalization and baseline;\n  - positive but wide CI \u2192\
  \ OK to scale, no strength claim;\n  - otherwise \u2192 describe it.\n- A CI containing\
  \ 0 is inconclusive. Never claim C is beaten.\n\n## Candidate (`models/pokedecision-v2-candidate/{best.pt,config.yaml,training_manifest.json}`)\n\
  - Config = the highest seed-mean pooled stage-2 greedy delta among E1/E2/E3. Checkpoint\
  \ = that config's MEDIAN-delta seed (to avoid winner's curse).\n- `training_manifest.json`\
  \ records:\n  - data run + split hash, C hashes, critic hash, \u03B2, seed;\n  -\
  \ all hyperparameters, git commit/dirty;\n  - `role: candidate`, `production: false`,\
  \ and the selection rule.\n- Save the candidate even if it doesn't beat C, and say\
  \ so.\n\n## Reports (exact names)\n- `w5_3_dataset_validation.json`: C-only provenance\
  \ counts, alignment proof reuse, split hash equal to W5.2.\n- `w5_3_advantage_stats.json`,\
  \ `w5_3_training_metrics.json`, `w5_3_policy_drift.json`, `w5_3_dev_ablation.json`.\n\
  - `w5_3_final_report.md`: English, concise, numbers from the JSONs. It must answer\
  \ the question, state the gate decision, and list limitations:\n  - noisy Monte\
  \ Carlo advantage;\n  - the greedy/sampling mismatch;\n  - the pilot's size;\n \
  \ - dev selection bias;\n  - the critic fit on the same data.\n"
